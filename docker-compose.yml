# `docker compose up` from a clean clone: builds, migrates, seeds and prints a banner
# with every endpoint (plan 3.11). All credentials are dev-only defaults; override in .env.
name: eos

x-backend-env: &backend-env
  APP_ENV: ${APP_ENV:-development}
  APP_NOW: ${APP_NOW:-2026-11-11T15:00:00Z}
  APP_CLOCK_MODE: ${APP_CLOCK_MODE:-ticking}
  LOG_LEVEL: ${LOG_LEVEL:-info}
  LOG_PAYLOADS: ${LOG_PAYLOADS:-true}
  TRUSTED_PROXY_HOSTS: ${TRUSTED_PROXY_HOSTS:-web}
  DATABASE_URL: postgresql+asyncpg://eos_app:${EOS_APP_PASSWORD:-eos_app_dev_pw}@db:5432/eos
  OWNER_DATABASE_URL: postgresql+asyncpg://eos_owner:${EOS_OWNER_PASSWORD:-eos_owner_dev_pw}@db:5432/eos
  READONLY_DATABASE_URL: postgresql+asyncpg://eos_readonly:${EOS_READONLY_PASSWORD:-eos_readonly_dev_pw}@db:5432/eos
  # Scratch database the rules report wipes and seeds on every run, never the demo data.
  REPORT_DATABASE_URL: postgresql+asyncpg://eos_owner:${EOS_OWNER_PASSWORD:-eos_owner_dev_pw}@db:5432/eos_report
  SESSION_SECRET: ${SESSION_SECRET:-dev-only-session-secret-change-me-0000000000000000}
  # Browser origins allowed to write (CSRF Origin check); defaults follow the ports in use.
  WEB_ORIGIN: ${WEB_ORIGIN:-http://localhost:${WEB_PORT:-3000},http://${PUBLIC_HOST:-localhost}:${WEB_PORT:-3000}}
  PUBLIC_HOST: ${PUBLIC_HOST:-localhost}
  WEB_PORT: ${WEB_PORT:-3000}
  API_PORT: ${API_PORT:-8000}
  DB_PORT: ${DB_PORT:-5433}
  LOGS_PORT: ${LOGS_PORT:-8080}
  REDIS_PORT: ${REDIS_PORT:-6379}
  # Redis cache-aside read layer (layer L3). Keys carry the database name, so the demo
  # and the E2E stack share this Redis without sharing entries.
  REDIS_URL: redis://:${REDIS_PASSWORD:-redis_dev_pw}@redis:6379/0
  CACHE_ENABLED: ${CACHE_ENABLED:-true}
  CACHE_TTL_TEAM: ${CACHE_TTL_TEAM:-600}
  CACHE_TTL_REF: ${CACHE_TTL_REF:-3600}
  # Redis rate limits on writes (layer L4): 10 logins a minute per address, 30 Make it an
  # Issue and 120 other writes a minute per user. false: no limits.
  RATE_LIMIT_ENABLED: ${RATE_LIMIT_ENABLED:-true}
  API_WORKERS: ${API_WORKERS:-2}
  WEB_RUNNER: ${WEB_RUNNER:-pm2}
  WEB_INSTANCES: ${WEB_INSTANCES:-2}
  SEED_PATH: /seed/seed.json

# Healthchecks probe every 2 s while a service starts (so `up` is quick), then every
# 30 s once it's healthy (so probes don't flood the logs).
x-healthcheck-timing: &healthcheck-timing
  start_period: 60s
  start_interval: 2s
  interval: 30s
  timeout: 3s
  retries: 3

# Container hardening for every service built from our images (plan 3.15, layer L4): a
# read-only root filesystem with a small writable /tmp (PM2_HOME and Python's temp files
# live there), no privilege escalation, and no Linux capabilities (none is needed: the
# ports are above 1024 and the processes run as non-root users). READ_ONLY_FS=false keeps
# the root filesystem writable, for debugging inside a container.
x-hardening: &hardening
  read_only: ${READ_ONLY_FS:-true}
  tmpfs:
    - /tmp:size=64m,mode=1777
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL

services:
  db:
    image: postgres:17.12-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres_dev_pw}
      POSTGRES_DB: postgres
      EOS_OWNER_PASSWORD: ${EOS_OWNER_PASSWORD:-eos_owner_dev_pw}
      EOS_APP_PASSWORD: ${EOS_APP_PASSWORD:-eos_app_dev_pw}
      EOS_READONLY_PASSWORD: ${EOS_READONLY_PASSWORD:-eos_readonly_dev_pw}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d:ro
    ports:
      - "127.0.0.1:${DB_PORT:-5433}:5432"
    healthcheck:
      # TCP on purpose: during first-time init Postgres only listens on its socket.
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U postgres -d eos"]
      <<: *healthcheck-timing

  # A pure cache (plan 3.14): no persistence, LRU eviction at 128 MB. Postgres stays the
  # only source of truth, so losing everything here only costs cache misses. Debian
  # (bookworm) like the API image.
  redis:
    image: redis:8.2.3-bookworm
    # A password like the database roles: a cached entry is served to users as is, so
    # only the app may write one.
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:-redis_dev_pw}
    command:
      - redis-server
      - --requirepass
      - ${REDIS_PASSWORD:-redis_dev_pw}
      - --save
      - ""
      - --appendonly
      - "no"
      - --maxmemory
      - 128mb
      - --maxmemory-policy
      - allkeys-lru
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD-SHELL", "REDISCLI_AUTH=$$REDIS_PASSWORD redis-cli ping | grep -q PONG"]
      <<: *healthcheck-timing

  # The backend image is built once, here; api and info reuse it.
  migrate:
    build:
      context: ./backend
      target: runtime
    image: eos-backend:local
    <<: *hardening
    command: ["sh", "-c", "alembic upgrade head && python -m app.seed"]
    environment: *backend-env
    volumes:
      - ./seed:/seed:ro
    depends_on:
      db:
        condition: service_healthy
      # The seed replaces the cache generation, and won't finish without Redis.
      redis:
        condition: service_healthy
    restart: "no"

  api:
    image: eos-backend:local
    pull_policy: never
    <<: *hardening
    environment: *backend-env
    ports:
      - "${BIND_ADDR:-127.0.0.1}:${API_PORT:-8000}:8000"
    depends_on:
      migrate:
        condition: service_completed_successfully
    # Longer than Uvicorn's --timeout-graceful-shutdown (20 s), so shutdown can finish.
    stop_grace_period: 25s
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import sys, urllib.request; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=2).status == 200 else 1)"
      <<: *healthcheck-timing

  web:
    build:
      context: ./frontend
      args:
        API_INTERNAL_URL: http://api:8000
    image: eos-frontend:local
    <<: *hardening
    environment:
      NEXT_TELEMETRY_DISABLED: "1"
      # PM2 cluster mode (layer L2): WEB_RUNNER=node runs one plain Node process instead.
      WEB_RUNNER: ${WEB_RUNNER:-pm2}
      WEB_INSTANCES: ${WEB_INSTANCES:-2}
      # Per-request nonce Content-Security-Policy (layer L4, frontend/src/proxy.ts); off: none.
      CSP_MODE: ${CSP_MODE:-nonce}
    ports:
      - "${BIND_ADDR:-127.0.0.1}:${WEB_PORT:-3000}:3000"
    depends_on:
      api:
        condition: service_healthy
    stop_grace_period: 25s
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/healthz"]
      <<: *healthcheck-timing

  logs:
    image: amir20/dozzle:v11.5.0
    volumes:
      # Read-only mount, but the Docker API itself isn't limited by :ro (plan 3.10).
      - /var/run/docker.sock:/var/run/docker.sock:ro
    ports:
      - "127.0.0.1:${LOGS_PORT:-8080}:8080"

  info:
    image: eos-backend:local
    pull_policy: never
    <<: *hardening
    command: ["python", "-m", "app.banner"]
    environment: *backend-env
    depends_on:
      api:
        condition: service_healthy
      web:
        condition: service_healthy
    restart: "no"

  # Rules report (Phase 3). Only runs on demand and prints JSON to stdout:
  #   docker compose --progress quiet run --rm --build rules-report                               (at APP_NOW)
  #   docker compose --progress quiet run --rm --build -e APP_NOW=2026-11-18T15:00:00Z rules-report
  #   make rules-report        (rewrites the committed rules_report.json, see the Makefile)
  # It migrates, wipes and seeds its own eos_report database and needs nothing but `db`,
  # so the demo database `eos` (schema and data) is never touched. Its own build section
  # (same image as migrate) lets a fresh clone build on demand, and `--build` picks up code
  # edits; being in a profile keeps it out of `up` and `build`, so nothing builds twice.
  rules-report:
    profiles: ["tools"]
    build:
      context: ./backend
      target: runtime
    image: eos-backend:local
    <<: *hardening
    command: ["python", "-m", "app.rules_report"]
    environment:
      <<: *backend-env
      LOG_LEVEL: ${LOG_LEVEL:-warning}
    volumes:
      - ./seed:/seed:ro
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  # ---- End-to-end tests (Phase 7) ----------------------------------------------------
  # A separate stack for the browser tests: its own API and web server on the eos_test
  # database with a frozen clock, so E2E runs never touch the demo data in `eos`. Only
  # started on demand (profile "e2e"):
  #   docker compose --profile e2e build e2e-seed web-e2e
  #   docker compose run --rm e2e
  #   docker compose --profile e2e stop api-e2e web-e2e
  # The first run downloads Microsoft's Playwright image (about 2 GB).
  e2e-seed:
    profiles: ["e2e"]
    build:
      context: ./backend
      target: runtime
    image: eos-backend:local
    <<: *hardening
    # Fresh seed for every run: migrate eos_test, then wipe and reload it.
    command: ["sh", "-c", "alembic upgrade head && python -m app.seed --reset"]
    environment: &e2e-env
      <<: *backend-env
      APP_CLOCK_MODE: frozen
      DATABASE_URL: postgresql+asyncpg://eos_app:${EOS_APP_PASSWORD:-eos_app_dev_pw}@db:5432/eos_test
      OWNER_DATABASE_URL: postgresql+asyncpg://eos_owner:${EOS_OWNER_PASSWORD:-eos_owner_dev_pw}@db:5432/eos_test
      READONLY_DATABASE_URL: postgresql+asyncpg://eos_readonly:${EOS_READONLY_PASSWORD:-eos_readonly_dev_pw}@db:5432/eos_test
      TRUSTED_PROXY_HOSTS: web-e2e
      WEB_ORIGIN: http://web-e2e:3000
      # The browser tests sign in many times a minute from one address.
      RATE_LIMIT_ENABLED: "false"
    volumes:
      - ./seed:/seed:ro
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: "no"

  api-e2e:
    profiles: ["e2e"]
    image: eos-backend:local
    pull_policy: never
    <<: *hardening
    environment: *e2e-env
    depends_on:
      e2e-seed:
        condition: service_completed_successfully
    stop_grace_period: 25s
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import sys, urllib.request; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=2).status == 200 else 1)"
      <<: *healthcheck-timing

  web-e2e:
    profiles: ["e2e"]
    build:
      context: ./frontend
      args:
        API_INTERNAL_URL: http://api-e2e:8000
    image: eos-frontend-e2e:local
    <<: *hardening
    environment:
      NEXT_TELEMETRY_DISABLED: "1"
      # PM2 cluster mode (layer L2): WEB_RUNNER=node runs one plain Node process instead.
      WEB_RUNNER: ${WEB_RUNNER:-pm2}
      WEB_INSTANCES: ${WEB_INSTANCES:-2}
      # Per-request nonce Content-Security-Policy (layer L4, frontend/src/proxy.ts); off: none.
      CSP_MODE: ${CSP_MODE:-nonce}
    depends_on:
      api-e2e:
        condition: service_healthy
    stop_grace_period: 25s
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/healthz"]
      <<: *healthcheck-timing

  # The Playwright runner, in Microsoft's image with the matching browsers preinstalled.
  e2e:
    profiles: ["e2e"]
    image: mcr.microsoft.com/playwright:v1.65.1-noble
    working_dir: /e2e
    # npm's cache lives in a volume, so repeat runs install offline. The container runs as
    # root, so its traces and screenshots are made deletable by anyone afterwards (on a
    # Linux host they would otherwise be root-owned); the test exit status is kept.
    command:
      - sh
      - -c
      - >-
        npm ci --prefer-offline --no-audit --no-fund --loglevel=error && npx playwright test;
        status=$$?; chmod -R a+rwX test-results 2>/dev/null; exit $$status
    environment:
      E2E_BASE_URL: http://web-e2e:3000
      # Only "trace-demo" breaks the meeting test on purpose (artifacts/README.md).
      E2E_DEMO_FAILURE: ${E2E_DEMO_FAILURE:-}
      npm_config_cache: /npm-cache
      CI: "1"
    volumes:
      - ./e2e:/e2e
      - e2e-node-modules:/e2e/node_modules
      - e2e-npm-cache:/npm-cache
    shm_size: 1gb  # Chromium needs more shared memory than Docker's 64 MB default
    depends_on:
      web-e2e:
        condition: service_healthy

  # Test runner (plan section 6). Only starts on demand:
  #   docker compose run --rm tests                 (everything)
  #   docker compose run --rm tests pytest tests/rules
  # The backend source is mounted, so tests always run against the working tree.
  tests:
    profiles: ["test"]
    build:
      context: ./backend
      target: test
    image: eos-backend-test:local
    environment:
      APP_ENV: test
      # Quoted: unquoted, YAML reads it as a timestamp and compose passes "2026-11-11 15:00:00 +0000 UTC".
      APP_NOW: "2026-11-11T15:00:00Z"
      APP_CLOCK_MODE: frozen
      SEED_PATH: /seed/seed.json
      # The separate eos_test database: tests never touch the demo data in `eos`.
      DATABASE_URL: postgresql+asyncpg://eos_app:${EOS_APP_PASSWORD:-eos_app_dev_pw}@db:5432/eos_test
      OWNER_DATABASE_URL: postgresql+asyncpg://eos_owner:${EOS_OWNER_PASSWORD:-eos_owner_dev_pw}@db:5432/eos_test
      READONLY_DATABASE_URL: postgresql+asyncpg://eos_readonly:${EOS_READONLY_PASSWORD:-eos_readonly_dev_pw}@db:5432/eos_test
      REPORT_DATABASE_URL: postgresql+asyncpg://eos_owner:${EOS_OWNER_PASSWORD:-eos_owner_dev_pw}@db:5432/eos_test
      # The committed report, so a test can prove it is reproducible.
      RULES_REPORT_PATH: /repo/rules_report.json
      # The repo root, for tests that compare committed files (openapi.json).
      REPO_ROOT: /repo
      # The cache is on in the suite (layer L3); CACHE_ENABLED=false reruns it uncached.
      REDIS_URL: redis://:${REDIS_PASSWORD:-redis_dev_pw}@redis:6379/0
      CACHE_ENABLED: ${CACHE_ENABLED:-true}
      # Off for the suite; tests/api/test_rate_limits.py switches it on for its own app.
      RATE_LIMIT_ENABLED: "false"
    volumes:
      - ./backend:/app
      - ./seed:/seed:ro
      # The repo root, not the single file: a missing file in a short-syntax bind mount
      # would be created on the host as a directory named rules_report.json.
      - ./:/repo:ro
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  pgdata:
  e2e-node-modules:
  e2e-npm-cache:
