[project]
name = "eos-api"
version = "0.1.0"
description = "EOS / Level 10 Meeting API (Altri assessment)"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi==0.165.0",
    "uvicorn[standard]==0.54.0",
    "sqlalchemy[asyncio]==2.1.9",
    "asyncpg==0.32.0",
    "alembic==1.20.1",
    "pydantic==2.14.4",
    "pydantic-settings==2.16.3",
    "redis==8.1.0",
]

[dependency-groups]
dev = [
    "ruff==0.17.6",
    "pytest==9.2.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
# No .pytest_cache: tests run in a container (as root) with the source mounted, and a
# root-owned cache dir in the host checkout is a nuisance on Linux/macOS.
addopts = "-ra -p no:cacheprovider"

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py312"
# Same reason as pytest's cache: no root-owned cache dir in the mounted checkout.
cache-dir = "/tmp/ruff-cache"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "DTZ", "S"]
ignore = [
    "S101", # assert is fine in tests
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S"]
"alembic/**" = ["E501"]
